[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apksec"
version = "1.0.0"
description = "Offline static security auditor for Android APKs (pure Python, no aapt/jadx)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
apksec = "apksec.cli:main"

[tool.setuptools]
packages = ["apksec"]
